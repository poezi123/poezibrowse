[package]
name = "poezibrowse"
version = "0.3.0"
edition = "2024"
description = "A lean, private web browser for Linux written in Rust"
license = "GPL-3.0-or-later"
repository = "https://github.com/poezi123/poezibrowse"
authors = ["Leon (poezi123)"]

[dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
cairo-rs = { version = "0.18", features = ["png"] }
webkit2gtk = { version = "2", features = ["v2_40"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = "0.37"
dirs = "6"
ureq = "3"
adblock = { version = "0.13", default-features = false, features = ["content-blocking", "embedded-domain-resolver", "full-regex-handling"] }
keepass = { version = "0.15", features = ["save_kdbx4"] }
zeroize = "1.9.1"
hmac = "0.13.0"
sha2 = "0.11.0"
getrandom = "0.3"
javascriptcore-rs = "1.1"

[features]
servo = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
